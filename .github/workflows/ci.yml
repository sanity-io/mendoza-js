name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    name: 'Build, lint & coverage: Node.js LTS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: npx ls-engines
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint -- --quiet
      - run: pnpm run knip
      - run: pnpm run coverage

  test:
    name: 'Test: Node.js ${{ matrix.node }}, ${{ matrix.os }}'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
            # pnpm 12 itself needs a newer Node.js, so install on 22.13 and switch back before testing
            installNode: '22.13'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.installNode || matrix.node }}
      - run: pnpm install
      - uses: actions/setup-node@v7
        if: matrix.installNode
        with:
          node-version: ${{ matrix.node }}
      - run: npx ls-engines
      - run: npm test
